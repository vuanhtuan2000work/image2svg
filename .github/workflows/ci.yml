name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test / lint / skill gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (dev)
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check \
            src/image2svg/__init__.py \
            src/image2svg/__main__.py \
            src/image2svg/cli.py \
            src/image2svg/paths.py \
            src/image2svg/convert \
            src/image2svg/background \
            src/image2svg/config \
            src/image2svg/web \
            tests \
            scripts

      - name: Pytest
        run: pytest -q

      - name: Skill prepublish gate
        run: python scripts/prepublish-check.py

      - name: CLI smoke
        run: |
          image2svg --help
          python -c "from image2svg.web.app import app; assert app.title == 'image2svg'"
