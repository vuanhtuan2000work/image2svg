name: Bug report
description: Report unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve image2svg.
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "0.3.0 or git SHA"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.9"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: Exact CLI/API commands and a minimal input description
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
