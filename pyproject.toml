[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image2svg"
version = "0.3.0"
description = "Local PNG/image to SVG pipeline with vtracer, batch CLI, and a small web UI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "image2svg contributors" },
]
keywords = ["svg", "vtracer", "vectorize", "image-processing", "fastapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
  "vtracer==0.6.*",
  "pyyaml>=6.0",
  "scour>=0.38",
  "pillow>=10.0",
  "pillow-heif>=1.4.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.9",
  "svg.path>=6.0",
  "numpy>=1.26",
  "pulp>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "httpx>=0.27",
]
# Optional remove-bg / ML stacks are documented in docs/ and requirements-ml.txt.
# Install those separately — they pull large native wheels.

[project.urls]
Homepage = "https://github.com/vuanhtuan2000work/image2svg"
Repository = "https://github.com/vuanhtuan2000work/image2svg"
Issues = "https://github.com/vuanhtuan2000work/image2svg/issues"
Documentation = "https://github.com/vuanhtuan2000work/image2svg#readme"

[project.scripts]
image2svg = "image2svg.cli:main"
image2svg-server = "image2svg.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
image2svg = [
  "config/*.yaml",
  "web/*.html",
  "web/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501", # long lines still common in analyze/compiler math
  "B008", # FastAPI Depends/File/Form defaults
]

[tool.ruff.lint.per-file-ignores]
# Legacy analyzer was moved wholesale; keep CI focused on new package surface.
"src/image2svg/analyze/**" = ["I001", "UP035", "F841", "E402"]
